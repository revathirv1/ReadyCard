<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Health Card</title>
    <style>
      body {
        box-sizing: border-box;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: conic-gradient(  #f9844a, )
        color: #202124;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100%, 440px);
        box-sizing: border-box;
        padding: 28px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(67, 40, 16, 0.2);
      }

      h1 {
        margin-top: 0;
      }

      label {
        display: block;
        margin: 16px 0 6px;
        font-weight: 600;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #b8bec7;
        border-radius: 8px;
        font: inherit;
      }

      textarea {
        min-height: 88px;
        resize: vertical;
      }

      button {
        margin-top: 20px;
        padding: 11px 16px;
        border: 0;
        border-radius: 8px;
        background: #244f73;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #183b59;
      }

      #health-card {
        margin-top: 24px;
        overflow-wrap: anywhere;
      }

      #qrcode {
        margin-top: 16px;
      }

      #expiry-reminders {
        padding: 0 28px;
        border-radius: 12px;
        background: #fff4d6;
      }
    

    </style>
  </head>
  <body>
    <main>
      <h1>Child Health Card</h1>
      <p>Enter one child's details to create a scannable health-information QR code.</p>
      <section id="expiry-reminders" aria-live="polite"></section>

      
        <label for="childname">Child's name</label>
        <input id="text" name="name" maxlength="100" required>

         

        

        <label for="age">Age</label>
        <input id="text1" name="age" type="number" min="0" max="100" >

        <label for="dietary">dietary restrictions</label>
        <input id="text4" name="dr" type="text">

        <label for="allergies">Allergies</label>
        <textarea id="text2" name="allergies" maxlength="500"></textarea>

        <label for="Medicine/OTC">Medicine instructions (as advised by a healthcare professional)</label>
        <textarea id="text3" name="Medicine" maxlength="500"></textarea>

        <label for="emergencycontact">Emergency contact</label>
        <input id="text5" name="emergency_contact" maxlength="120">

        <label for="preferred-hospital">Preferred hospital</label>
        <input id="text6" name="preferred_hospital" maxlength="120">

        <button type="button" onclick="generateQR()">Create health card</button>

        <div id="qrcode" style="margin-top:20px;"></div>
        
        <div id="qrData" style="margin-top:20px;"></div>
      

      <section id="health-card" aria-live="polite" hidden>
        <h2 id="card-title"></h2>
        <div id="card-details"></div>
        <p id="qr-status" role="status"></p>
        <p>Anyone who scans this code can read the health details it contains.</p>
      </section>
                
    </main>
