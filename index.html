<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <script src="script.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Health Card</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: #fff;
        color: #202124;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(100%, 440px);
        max-width: 100%;
        min-width: 0;
        padding: 28px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(67, 40, 16, 0.2);
      }

      h1 {
        margin-top: 0;
      }

      label {
        display: block;
        margin: 16px 0 6px;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid #b8bec7;
        border-radius: 8px;
        font: inherit;
        font-size: 16px;
      }

      textarea {
        min-height: 88px;
        resize: vertical;
      }

      button {
        margin-top: 20px;
        min-height: 48px;
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #244f73;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #183b59;
      }

      #form-error {
        margin: 8px 0 0;
        color: #c5221f;
        font-weight: 600;
      }

      #form-error:empty {
        display: none;
      }

      #share-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      #share-button[hidden] {
        display: none;
      }

      #share-sheet {
        width: min(100% - 32px, 420px);
        box-sizing: border-box;
        padding: 20px;
        border: 0;
        border-radius: 16px;
        color: #202124;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25);
      }

      #share-sheet::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }

      /* On phones, slide up from the bottom like a native share sheet. */
      @media (max-width: 600px) {
        #share-sheet {
          width: 100%;
          max-width: none;
          margin: auto 0 0;
          border-radius: 16px 16px 0 0;
        }
      }

      .sheet-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sheet-header h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      #share-sheet .close-button {
        margin: 0;
        padding: 6px;
        background: transparent;
        color: #5f6368;
        line-height: 0;
      }

      #share-sheet .close-button:hover {
        background: #f1f3f4;
      }

      .share-apps {
        display: flex;
        gap: 16px;
        margin: 20px 0;
        overflow-x: auto;
      }

      .share-app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        min-width: 64px;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: #202124;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 400;
        text-decoration: none;
        cursor: pointer;
      }

      .share-app:hover {
        background: transparent;
      }

      .share-app[hidden] {
        display: none;
      }

      .share-icon {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        color: #fff;
      }

      .share-app:hover .share-icon {
        filter: brightness(0.92);
      }

      .link-box {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 12px;
        border: 1px solid #dadce0;
        border-radius: 10px;
        background: #f8f9fa;
      }

      .link-box input {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: #5f6368;
      }

      .link-box button {
        margin: 0;
        padding: 8px 16px;
        border-radius: 999px;
      }

      #share-status {
        min-height: 1.2em;
        margin: 10px 0 0;
        font-size: 0.85rem;
        color: #188038;
      }

      #health-card {
        margin-top: 24px;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      #qrData {
        overflow-wrap: anywhere;
      }

      #card-details p {
        margin: 12px 0;
      }

      body.scanned-view main > p,
      body.scanned-view #expiry-reminders,
      body.scanned-view #entry-form,
      body.scanned-view #qrcode,
      body.scanned-view #qrData {
        display: none;
      }

      body.scanned-view #health-card {
        display: block;
      }

      #qrcode {
        margin-top: 16px;
        max-width: 100%;
      }

      #qrcode canvas,
      #qrcode img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      #expiry-reminders {
        max-width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        background: #fff4d6;
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        main {
          padding: 20px;
          border-radius: 16px;
        }

        button {
          width: 100%;
        }
      }

    </style>
  </head>
  <body>
    <main>
      <h1>Child Health Card</h1>
      <p>Enter one child's details to create a scannable health-information QR code.</p>
      <section id="expiry-reminders" aria-live="polite"></section>

      <div id="entry-form">
        <label for="childname">Child's name</label>
        <input id="text" name="name" maxlength="100" required>

         

        

        <label for="age">Age</label>
        <input id="text1" name="age" type="number" min="0" max="100" >

        <label for="dietary">dietary restrictions</label>
        <input id="text4" name="dr" type="text">

        <label for="allergies">Allergies</label>
        <textarea id="text2" name="allergies" maxlength="500"></textarea>

        <label for="Medicine/OTC">Medicine instructions (as advised by a healthcare professional)</label>
        <textarea id="text3" name="Medicine" maxlength="500"></textarea>

        <label for="emergencycontact">Emergency contact</label>
        <input id="text5" name="emergency_contact" maxlength="120">

        <label for="preferred-hospital">Preferred hospital</label>
        <input id="text6" name="preferred_hospital" maxlength="120">

        <button type="button" onclick="generateQR()">Create health card</button>
        <p id="form-error" role="alert"></p>

        <div id="qrcode" style="margin-top:20px;"></div>
      </div>

        <button type="button" id="share-button" onclick="openShareSheet()" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
          Share
        </button>

        <dialog id="share-sheet" aria-labelledby="share-title">
          <div class="sheet-header">
            <h2 id="share-title">Share</h2>
            <button type="button" class="close-button" onclick="closeShareSheet()" aria-label="Close">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
            </button>
          </div>

          <div class="share-apps">
            <a id="share-whatsapp" class="share-app" target="_blank" rel="noopener">
              <span class="share-icon" style="background:#25d366">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5.1 5.1 0 0 0 1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.5-.3z"/></svg>
              </span>
              WhatsApp
            </a>
            <a id="share-messages" class="share-app">
              <span class="share-icon" style="background:#34c759">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 5 3.7 6.5L5 21l3.6-1.9c1.1.3 2.2.4 3.4.4 5.5 0 10-3.8 10-8.5S17.5 3 12 3z"/></svg>
              </span>
              Messages
            </a>
            <a id="share-email" class="share-app">
              <span class="share-icon" style="background:#5f6368">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5z"/></svg>
              </span>
              Email
            </a>
            <button type="button" id="share-more" class="share-app" onclick="shareLink()" hidden>
              <span class="share-icon" style="background:#e8eaed;color:#3c4043">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
              </span>
              More
            </button>
          </div>

          <div class="link-box">
            <input
                  id="text5"
                  name="emergency_contact"
                  type="tel"
                  minlength="10"
                  maxlength="10"
                  pattern="[0-9]{10}"
                  title="Enter exactly 10 digits"
          </div>
          <p id="share-status" role="status"></p>
        </dialog>

        <div id="qrData" style="margin-top:20px;"></div>
      

      <section id="health-card" aria-live="polite" hidden>
        <h2 id="card-title">Medical information</h2>
        <div id="card-details"></div>
        <p id="qr-status" role="status"></p>
        <p>Anyone who scans this code can read the health details it contains.</p>
      </section>
                
    </main>
